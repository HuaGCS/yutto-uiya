name: Build and Push to GitHub Container Registry

on:
  push:
    tags:
      - 'v*.*.*'  # 仅在推送 v1.1.4 格式的标签时触发构建
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: '版本号 (例如: 1.1.4 或 latest)'
        required: true
        default: 'latest'
      use_tag_code:
        description: '使用对应标签的代码构建'
        type: boolean
        default: false
      push_to_registry:
        description: '是否推送到镜像仓库'
        type: boolean
        default: true
      architectures:
        description: '构建架构 (可选: amd64, arm64, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
          - 'amd64,arm64'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/yutto-uiya

jobs:
  # 检查标签是否在 dev 分支上
  check-tag-branch:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      tag-branch: ${{ steps.check.outputs.tag-branch }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整的 git 历史
        ref: |
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.use_tag_code == 'true' &&
            github.event.inputs.version != 'latest'
            && format('v{0}', github.event.inputs.version)
            || 'dev'
          }}

    - name: Check if tag is on dev branch
      id: check
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # 手动触发总是允许构建
          echo "should-build=true" >> $GITHUB_OUTPUT
          echo "tag-branch=manual" >> $GITHUB_OUTPUT
          echo "✅ 手动触发构建"
        elif [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "🏷️ 检查标签: $TAG_NAME"

          # 检查标签是否在 dev 分支上
          if git merge-base --is-ancestor ${{ github.sha }} origin/dev; then
            echo "✅ 标签 $TAG_NAME 在 dev 分支上，允许构建"
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "tag-branch=dev" >> $GITHUB_OUTPUT
          else
            echo "❌ 标签 $TAG_NAME 不在 dev 分支上，跳过构建"
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "tag-branch=other" >> $GITHUB_OUTPUT
          fi
        else
          # 其他情况（如分支推送）不构建
          echo "❌ 非标签推送，跳过构建"
          echo "should-build=false" >> $GITHUB_OUTPUT
          echo "tag-branch=none" >> $GITHUB_OUTPUT
        fi

  # 准备构建矩阵
  prepare-matrix:
    needs: check-tag-branch
    runs-on: ubuntu-latest
    # 只有在需要构建时才运行
    if: needs.check-tag-branch.outputs.should-build == 'true'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build-multi: ${{ steps.set-matrix.outputs.build-multi }}
      multi-platforms: ${{ steps.set-matrix.outputs.multi-platforms }}
      actual-version: ${{ steps.set-matrix.outputs.actual-version }}
      code-ref: ${{ steps.set-matrix.outputs.code-ref }}
    steps:
    - name: Checkout repository for tag detection
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整的 git 历史和所有标签

    - name: Determine version and code reference
      id: version-ref
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION_INPUT="${{ github.event.inputs.version }}"
          USE_TAG_CODE="${{ github.event.inputs.use_tag_code }}"

        if [[ "$USE_TAG_CODE" == "true" ]]; then
            if [[ "$VERSION_INPUT" == "latest" ]]; then
              # 获取最新的标签
              LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-version:refname | head -n1)
              if [[ -n "$LATEST_TAG" ]]; then
                ACTUAL_VERSION="$LATEST_TAG"
                SHORT_VERSION="${LATEST_TAG#v}"
                CODE_REF="$LATEST_TAG"
                echo "🔍 latest + use_tag_code=true: 检测到最新标签 $LATEST_TAG，使用该标签代码"
              else
                echo "❌ 未找到任何版本标签，回退到 dev 分支"
                ACTUAL_VERSION="latest"
                SHORT_VERSION="latest"
                CODE_REF="dev"
              fi
            else
              # 使用指定版本的标签代码
              TAG_NAME="v$VERSION_INPUT"
              if git rev-parse --verify "$TAG_NAME" >/dev/null 2>&1; then
                ACTUAL_VERSION="$TAG_NAME"
                SHORT_VERSION="$VERSION_INPUT"
                CODE_REF="$TAG_NAME"
                echo "🏷️ 使用指定标签 $TAG_NAME 的代码"
              else
                echo "❌ 标签 $TAG_NAME 不存在，回退到 dev 分支代码"
                ACTUAL_VERSION="v$VERSION_INPUT"
                SHORT_VERSION="$VERSION_INPUT"
                CODE_REF="dev"
              fi
            fi
          else
            # 使用 dev 分支最新代码
            ACTUAL_VERSION="$VERSION_INPUT"
            if [[ "$VERSION_INPUT" != "latest" ]]; then
              SHORT_VERSION="$VERSION_INPUT"
            else
              SHORT_VERSION="latest"
            fi
            CODE_REF="dev"
            echo "🔧 使用 dev 分支最新代码，镜像标签: $VERSION_INPUT"
          fi
        else
          # 标签触发 - 使用标签对应的代码
          ACTUAL_VERSION="${GITHUB_REF#refs/tags/}"
          SHORT_VERSION="${ACTUAL_VERSION#v}"
          CODE_REF="${ACTUAL_VERSION}"
          echo "🏷️ 标签触发，使用标签代码: $ACTUAL_VERSION"
        fi

        echo "actual_version=${ACTUAL_VERSION}" >> $GITHUB_OUTPUT
        echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT
        echo "code_ref=${CODE_REF}" >> $GITHUB_OUTPUT

    - name: Set build matrix
      id: set-matrix
      run: |
        # 确定要构建的架构
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ARCH_INPUT="${{ github.event.inputs.architectures }}"
        else
          ARCH_INPUT="all"
        fi

        echo "架构输入: $ARCH_INPUT"
        echo "实际版本: ${{ steps.version-ref.outputs.actual_version }}"
        echo "代码引用: ${{ steps.version-ref.outputs.code_ref }}"

        # 根据输入设置构建矩阵
        case "$ARCH_INPUT" in
          "amd64")
            MATRIX='[{"platform":"linux/amd64","arch":"amd"}]'
            BUILD_MULTI="false"
            MULTI_PLATFORMS="linux/amd64"
            ;;
          "arm64")
            MATRIX='[{"platform":"linux/arm64","arch":"arm64"}]'
            BUILD_MULTI="false"
            MULTI_PLATFORMS="linux/arm64"
            ;;
          "amd64,arm64"|"all"|"")
            MATRIX='[{"platform":"linux/amd64","arch":"amd"},{"platform":"linux/arm64","arch":"arm64"}]'
            BUILD_MULTI="true"
            MULTI_PLATFORMS="linux/amd64,linux/arm64"
            ;;
          *)
            echo "不支持的架构: $ARCH_INPUT，使用默认的所有架构"
            MATRIX='[{"platform":"linux/amd64","arch":"amd"},{"platform":"linux/arm64","arch":"arm64"}]'
            BUILD_MULTI="true"
            MULTI_PLATFORMS="linux/amd64,linux/arm64"
            ;;
        esac

        echo "构建矩阵: $MATRIX"
        echo "构建多架构: $BUILD_MULTI"
        echo "多架构平台: $MULTI_PLATFORMS"

        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
        echo "build-multi=$BUILD_MULTI" >> $GITHUB_OUTPUT
        echo "multi-platforms=$MULTI_PLATFORMS" >> $GITHUB_OUTPUT
        echo "actual-version=${{ steps.version-ref.outputs.actual_version }}" >> $GITHUB_OUTPUT
        echo "code-ref=${{ steps.version-ref.outputs.code_ref }}" >> $GITHUB_OUTPUT

  # 构建单架构镜像
  build-single-arch:
    needs: [check-tag-branch, prepare-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 只有在需要构建时才运行
    if: needs.check-tag-branch.outputs.should-build == 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整的 git 历史和标签
        ref: ${{ needs.prepare-matrix.outputs.code-ref }}

    - name: Check and create Dockerfile if needed
      run: |
        echo "🔍 检查 Dockerfile..."
        if [ ! -f "Dockerfile" ]; then
          echo "❌ 未找到 Dockerfile，创建一个支持 yutto 自动更新的 Dockerfile..."

          cat > Dockerfile << 'DOCKERFILE_EOF'
          # 多阶段构建，支持 yutto 自动更新
          FROM python:3.11-slim

          # 设置维护者信息和标签
          LABEL maintainer="auto-generated" \
                description="yutto-uiya with auto-updating yutto" \
                version="1.0.0"

          # 构建参数
          ARG VERSION=latest
          ARG BUILD_DATE
          ARG TARGETPLATFORM
          ARG TARGETARCH

          # 设置环境变量
          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              PIP_NO_CACHE_DIR=1 \
              PIP_DISABLE_PIP_VERSION_CHECK=1 \
              VERSION=${VERSION} \
              YUTTO_AUTO_UPDATE=true \
              YUTTO_UPDATE_INTERVAL=3600 \
              YUTTO_IDLE_TIME=1800

          # 安装系统依赖
          RUN apt-get update && apt-get install -y \
              ffmpeg \
              git \
              curl \
              supervisor \
              procps \
              && rm -rf /var/lib/apt/lists/*

          # 配置 pip 使用国内镜像源（可选）
          #RUN pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple

          # 安装 uv 包管理器
          RUN pip install uv

          # 创建非 root 用户
          RUN groupadd -r yutto && useradd -r -g yutto -s /bin/bash yutto

          # 设置工作目录
          WORKDIR /app

          # 复制项目文件
          COPY . .

          # 如果在国内，修改 pyproject.toml 使用国内源
          #RUN if [ -f pyproject.toml ]; then \
          #        sed -i 's|python-install-mirror = "https://github.com/astral-sh/python-build-standalone/releases/download"|python-install-mirror = "https://mirror.nju.edu.cn/github-release/indygreg/python-build-standalone/"|g' pyproject.toml && \
          #        sed -i 's|# name = "tsinghua"|name = "tsinghua"|g' pyproject.toml && \
          #        sed -i 's|# url = "https://pypi.tuna.tsinghua.edu.cn/simple"|url = "https://pypi.tuna.tsinghua.edu.cn/simple"|g' pyproject.toml && \
          #        sed -i 's|# default = true|default = true|g' pyproject.toml && \
          #        sed -i 's|name = "pypi"|# name = "pypi"|g' pyproject.toml && \
          #        sed -i 's|url = "https://pypi.org/simple"|# url = "https://pypi.org/simple"|g' pyproject.toml && \
          #        sed -i 's|default= true|# default= true|g' pyproject.toml; \
          #    fi

          # 安装 yutto 和其他依赖
          RUN pip install yutto streamlit

          # 使用 uv 安装项目依赖（如果可能）
          RUN uv lock || echo "Lock file generation failed, continuing..." && \
              uv sync || echo "Sync failed, using pip fallback..." && \
              pip install -e . || echo "Project install failed, dependencies may be handled separately"

          # 创建 yutto 智能更新脚本
          RUN cat > /usr/local/bin/yutto-updater.sh << 'UPDATER_EOF'
          #!/bin/bash

          LOG_FILE="/var/log/yutto-updater.log"
          LOCK_FILE="/tmp/yutto-update.lock"
          ACTIVITY_FILE="/tmp/yutto-activity"
          UPDATE_INTERVAL=${YUTTO_UPDATE_INTERVAL:-3600}

          log_message() {
              echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" | tee -a "$LOG_FILE"
          }

          check_yutto_activity() {
              if pgrep -f "yutto" > /dev/null; then
                  log_message "检测到 yutto 进程运行中，跳过更新"
                  return 1
              fi

              if [ -f "$ACTIVITY_FILE" ]; then
                  local last_activity=$(stat -c %Y "$ACTIVITY_FILE" 2>/dev/null || echo 0)
                  local current_time=$(date +%s)
                  local idle_time=$((current_time - last_activity))
                  local idle_threshold=${YUTTO_IDLE_TIME:-1800}

                  if [ $idle_time -lt $idle_threshold ]; then
                      log_message "检测到 $((idle_threshold/60)) 分钟内有活动，延迟更新"
                      return 1
                  fi
              fi

              return 0
          }

          update_yutto() {
              if [ -f "$LOCK_FILE" ]; then
                  local lock_age=$(($(date +%s) - $(stat -c %Y "$LOCK_FILE" 2>/dev/null || echo 0)))
                  if [ $lock_age -lt 3600 ]; then
                      return
                  else
                      rm -f "$LOCK_FILE"
                  fi
              fi

              touch "$LOCK_FILE"

              local current_version=$(pip show yutto 2>/dev/null | grep "Version:" | cut -d' ' -f2 || echo "unknown")
              local latest_version=$(pip index versions yutto 2>/dev/null | head -n1 | awk '{print $2}' || echo "unknown")

              if [ "$current_version" = "$latest_version" ] || [ "$latest_version" = "unknown" ]; then
                  log_message "yutto 已是最新版本: $current_version"
                  rm -f "$LOCK_FILE"
                  return
              fi

              log_message "发现新版本: $current_version -> $latest_version"

              if ! check_yutto_activity; then
                  rm -f "$LOCK_FILE"
                  return
              fi

              log_message "开始更新 yutto..."

              if pip install --upgrade yutto 2>&1 | tee -a "$LOG_FILE"; then
                  local new_version=$(pip show yutto | grep "Version:" | cut -d' ' -f2)
                  log_message "✅ yutto 更新成功: $new_version"
              else
                  log_message "❌ yutto 更新失败"
              fi

              rm -f "$LOCK_FILE"
          }

          if [ "${YUTTO_AUTO_UPDATE:-true}" = "true" ]; then
              log_message "🚀 yutto 自动更新守护程序启动"
              while true; do
                  update_yutto
                  sleep $UPDATE_INTERVAL
              done
          else
              log_message "⚠️ 自动更新已禁用"
              sleep infinity
          fi
          UPDATER_EOF

          # 创建 supervisor 配置
          RUN mkdir -p /etc/supervisor/conf.d && \
              cat > /etc/supervisor/conf.d/yutto-services.conf << 'SUPERVISOR_EOF'
          [program:yutto-updater]
          command=/bin/bash /usr/local/bin/yutto-updater.sh
          user=yutto
          autostart=true
          autorestart=true
          redirect_stderr=true
          stdout_logfile=/var/log/yutto-updater.log

          [program:streamlit]
          command=streamlit run src/uiya/yutto_uiya.py --server.address 0.0.0.0 --server.port 8501
          directory=/app
          user=yutto
          autostart=true
          autorestart=true
          redirect_stderr=true
          stdout_logfile=/var/log/streamlit.log
          environment=PYTHONPATH="/app:/app/src"
          SUPERVISOR_EOF

          # 设置权限和目录
          RUN chmod +x /usr/local/bin/yutto-updater.sh && \
              mkdir -p /var/log /app/downloads /app/config /home/yutto && \
              touch /var/log/yutto-updater.log /var/log/streamlit.log && \
              chown -R yutto:yutto /app /var/log/yutto-updater.log /var/log/streamlit.log /tmp /home/yutto

          # 创建启动脚本
          RUN cat > /usr/local/bin/start-services.sh << 'START_EOF'
          #!/bin/bash

          echo "🚀 启动 yutto-uiya (版本: ${VERSION})"
          echo "📋 配置: 自动更新=${YUTTO_AUTO_UPDATE:-true}, 检查间隔=${YUTTO_UPDATE_INTERVAL:-3600}秒"

          # 检查应用文件是否存在
          if [ -f "/app/src/uiya/yutto_uiya.py" ]; then
              echo "✅ 找到应用文件: /app/src/uiya/yutto_uiya.py"
          elif [ -f "/app/yutto_uiya.py" ]; then
              echo "✅ 找到应用文件: /app/yutto_uiya.py"
              # 如果在根目录，更新 supervisor 配置
              sed -i 's|src/uiya/yutto_uiya.py|yutto_uiya.py|g' /etc/supervisor/conf.d/yutto-services.conf
          else
              echo "❌ 未找到 yutto_uiya.py 文件，请检查项目结构"
              echo "尝试查找..."
              find /app -name "*yutto*.py" -type f | head -5
          fi

          # 确保权限正确
          mkdir -p /var/log
          touch /var/log/yutto-updater.log /var/log/streamlit.log
          chown yutto:yutto /var/log/yutto-updater.log /var/log/streamlit.log

          # 启动 supervisor
          exec /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
          START_EOF

          RUN chmod +x /usr/local/bin/start-services.sh

          # 暴露端口
          EXPOSE 8501

          # 设置时区
          ENV TZ=Asia/Shanghai

          # 健康检查
          HEALTHCHECK --interval=30s --timeout=10s --start-period=30s --retries=3 \
              CMD curl -f http://localhost:8501/_stcore/health || exit 1

          # 使用 supervisor 启动所有服务
          CMD ["/usr/local/bin/start-services.sh"]
          DOCKERFILE_EOF

          echo "✅ 自动生成的 Dockerfile 已创建"
        else
          echo "✅ 发现现有的 Dockerfile"
        fi

    - name: Extract metadata
      id: meta
      run: |
        # 使用 prepare-matrix 阶段确定的版本信息
        VERSION="${{ needs.prepare-matrix.outputs.actual-version }}"
        SHORT_VERSION="${{ needs.prepare-matrix.outputs.actual-version }}"

        # 如果版本以 v 开头，去掉 v
        if [[ "$SHORT_VERSION" =~ ^v[0-9] ]]; then
          SHORT_VERSION="${SHORT_VERSION#v}"
        fi

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT
        echo "code_ref=${{ needs.prepare-matrix.outputs.code-ref }}" >> $GITHUB_OUTPUT

        # 显示构建信息
        echo "🏗️ 构建信息:"
        echo "   版本: ${VERSION}"
        echo "   短版本: ${SHORT_VERSION}"
        echo "   代码引用: ${{ needs.prepare-matrix.outputs.code-ref }}"
        echo "   架构: ${{ matrix.arch }}"

        # 转换为小写（GitHub Container Registry 要求）
        IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

        # 生成单架构镜像标签
        ARCH_TAGS="${REGISTRY}/${IMAGE_NAME_LOWER}-${{ matrix.arch }}:${SHORT_VERSION}"

        # 总是添加 latest 标签（因为只有标签推送或手动触发才会到这里）
        ARCH_TAGS="${ARCH_TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}-${{ matrix.arch }}:latest"

        # 如果是稳定版本，添加 stable 标签
        if [[ ! "${VERSION}" =~ (alpha|beta|rc|latest) ]]; then
          ARCH_TAGS="${ARCH_TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}-${{ matrix.arch }}:stable"
        fi

        echo "arch_tags=${ARCH_TAGS}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push single-arch image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true' }}
        tags: ${{ steps.meta.outputs.arch_tags }}
        labels: |
          org.opencontainers.image.title=yutto-uiya-${{ matrix.arch }}
          org.opencontainers.image.description=yutto-uiya - bilibili video downloader with Streamlit WebUI (${{ matrix.arch }})
          org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.platform=${{ matrix.platform }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          TARGETPLATFORM=${{ matrix.platform }}
          TARGETARCH=${{ matrix.arch }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # 构建多架构通用镜像
  build-multi-arch:
    needs: [check-tag-branch, prepare-matrix, build-single-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 只有在需要构建且为多架构时才运行
    if: needs.check-tag-branch.outputs.should-build == 'true' && needs.prepare-matrix.outputs.build-multi == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整的 git 历史和标签
        ref: ${{ needs.prepare-matrix.outputs.code-ref }}

    - name: Extract metadata
      id: meta
      run: |
        # 使用 prepare-matrix 阶段确定的版本信息
        VERSION="${{ needs.prepare-matrix.outputs.actual-version }}"
        SHORT_VERSION="${{ needs.prepare-matrix.outputs.short-version }}"

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT
        echo "code_ref=${{ needs.prepare-matrix.outputs.code-ref }}" >> $GITHUB_OUTPUT

        # 显示构建信息
        echo "🏗️ 多架构构建信息:"
        echo "   版本: ${VERSION}"
        echo "   短版本: ${SHORT_VERSION}"
        echo "   代码引用: ${{ needs.prepare-matrix.outputs.code-ref }}"

        # 转换为小写
        IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

        # 生成多架构镜像标签
        MULTI_TAGS="${REGISTRY}/${IMAGE_NAME_LOWER}:${SHORT_VERSION}"
        MULTI_TAGS="${MULTI_TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}:latest"

        # 如果是稳定版本，添加 stable 标签
        if [[ ! "${VERSION}" =~ (alpha|beta|rc|latest) ]]; then
          MULTI_TAGS="${MULTI_TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}:stable"
        fi

        echo "multi_tags=${MULTI_TAGS}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push multi-arch image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ needs.prepare-matrix.outputs.multi-platforms }}
        push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true' }}
        tags: ${{ steps.meta.outputs.multi_tags }}
        labels: |
          org.opencontainers.image.title=yutto-uiya
          org.opencontainers.image.description=yutto-uiya - bilibili video downloader with Streamlit WebUI
          org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
        cache-from: |
          type=gha,scope=amd
          type=gha,scope=arm64
        cache-to: type=gha,mode=max,scope=multi

  # 跳过构建的通知
  skip-build:
    needs: check-tag-branch
    runs-on: ubuntu-latest
    if: needs.check-tag-branch.outputs.should-build == 'false'

    steps:
    - name: Skip build notification
      run: |
        echo "## ⏭️ 跳过 Docker 镜像构建" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 跳过原因" >> $GITHUB_STEP_SUMMARY

        TAG_BRANCH="${{ needs.check-tag-branch.outputs.tag-branch }}"
        case "$TAG_BRANCH" in
          "other")
            echo "- ❌ **标签不在 dev 分支上**" >> $GITHUB_STEP_SUMMARY
            echo "- 📝 只有在 dev 分支上的标签才会触发构建" >> $GITHUB_STEP_SUMMARY
            echo "- 💡 请确保在 dev 分支上创建和推送标签" >> $GITHUB_STEP_SUMMARY
            ;;
          "none")
            echo "- ❌ **非标签推送事件**" >> $GITHUB_STEP_SUMMARY
            echo "- 📝 只有推送标签 (v*.*.*) 才会触发构建" >> $GITHUB_STEP_SUMMARY
            echo "- 💡 普通的分支推送不会触发构建" >> $GITHUB_STEP_SUMMARY
            ;;
          *)
            echo "- ❌ **未知原因**" >> $GITHUB_STEP_SUMMARY
            ;;
        esac

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 如何触发构建" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 方式 1: 在 dev 分支创建标签" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "git checkout dev" >> $GITHUB_STEP_SUMMARY
        echo "git tag v1.0.1" >> $GITHUB_STEP_SUMMARY
        echo "git push origin v1.0.1" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 方式 2: 手动触发工作流" >> $GITHUB_STEP_SUMMARY
        echo "- 在 Actions 页面点击 'Run workflow'" >> $GITHUB_STEP_SUMMARY
        echo "- 选择版本号和架构进行构建" >> $GITHUB_STEP_SUMMARY

  # 构建状态通知
  notify:
    needs: [check-tag-branch, prepare-matrix, build-single-arch]
    runs-on: ubuntu-latest
    if: always() && needs.check-tag-branch.outputs.should-build == 'true'

    steps:
    - name: Check multi-arch build status
      id: check-multi
      run: |
        if [[ "${{ needs.prepare-matrix.outputs.build-multi }}" == "true" ]]; then
          echo "multi_arch_needed=true" >> $GITHUB_OUTPUT
          if [[ "${{ needs.build-multi-arch.result }}" == "success" ]] || [[ "${{ needs.build-multi-arch.result }}" == "skipped" ]]; then
            echo "multi_arch_success=true" >> $GITHUB_OUTPUT
          else
            echo "multi_arch_success=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "multi_arch_needed=false" >> $GITHUB_OUTPUT
          echo "multi_arch_success=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata
      id: meta
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
          ARCH_INPUT="${{ github.event.inputs.architectures }}"
          if [[ "$VERSION" != "latest" ]]; then
            SHORT_VERSION="$VERSION"
          else
            SHORT_VERSION="latest"
          fi
        else
          VERSION=${GITHUB_REF#refs/tags/}
          SHORT_VERSION=${VERSION#v}
          ARCH_INPUT="all"
        fi

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT
        echo "arch_input=${ARCH_INPUT}" >> $GITHUB_OUTPUT

        IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

    - name: Success Summary
      if: needs.build-single-arch.result == 'success' && steps.check-multi.outputs.multi_arch_success == 'true'
      run: |
        echo "## ✅ Docker 镜像构建成功！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🏗️ 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **架构**: ${{ steps.meta.outputs.arch_input }}" >> $GITHUB_STEP_SUMMARY
        echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **标签分支**: ${{ needs.check-tag-branch.outputs.tag-branch }}" >> $GITHUB_STEP_SUMMARY
        echo "- **构建时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 📦 构建的镜像" >> $GITHUB_STEP_SUMMARY

        # 根据架构显示不同的镜像
        case "${{ steps.meta.outputs.arch_input }}" in
          "amd64")
            echo "- **AMD64 专用**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-amd:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            ;;
          "arm64")
            echo "- **ARM64 专用**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-arm64:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            ;;
          *)
            echo "- **多架构镜像**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **AMD64 专用**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-amd:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **ARM64 专用**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-arm64:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            ;;
        esac

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔄 yutto 自动更新功能" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 镜像集成了 yutto 自动更新功能" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 支持智能空闲检测和安全更新" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 可通过环境变量控制更新策略" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 使用方法" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY

        # 根据构建的架构提供相应的使用示例
        case "${{ steps.meta.outputs.arch_input }}" in
          "amd64")
            echo "# 使用 AMD64 专用镜像" >> $GITHUB_STEP_SUMMARY
            echo "docker run -d -p 8501:8501 -v \$(pwd)/downloads:/app/downloads \\" >> $GITHUB_STEP_SUMMARY
            echo "  ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-amd:${{ steps.meta.outputs.short_version }}" >> $GITHUB_STEP_SUMMARY
            ;;
          "arm64")
            echo "# 使用 ARM64 专用镜像" >> $GITHUB_STEP_SUMMARY
            echo "docker run -d -p 8501:8501 -v \$(pwd)/downloads:/app/downloads \\" >> $GITHUB_STEP_SUMMARY
            echo "  ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-arm64:${{ steps.meta.outputs.short_version }}" >> $GITHUB_STEP_SUMMARY
            ;;
          *)
            echo "# 使用多架构镜像（推荐，Docker 自动选择合适架构）" >> $GITHUB_STEP_SUMMARY
            echo "docker run -d -p 8501:8501 -v \$(pwd)/downloads:/app/downloads \\" >> $GITHUB_STEP_SUMMARY
            echo "  ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}:${{ steps.meta.outputs.short_version }}" >> $GITHUB_STEP_SUMMARY
            ;;
        esac

        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Failure Summary
      if: needs.build-single-arch.result == 'failure' || steps.check-multi.outputs.multi_arch_success == 'false'
      run: |
        echo "## ❌ Docker 镜像构建失败！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **架构**: ${{ steps.meta.outputs.arch_input }}" >> $GITHUB_STEP_SUMMARY
        echo "- **单架构构建**: ${{ needs.build-single-arch.result }}" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ steps.check-multi.outputs.multi_arch_needed }}" == "true" ]]; then
          echo "- **多架构构建**: ${{ needs.build-multi-arch.result }}" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "请查看上方的构建日志获取详细错误信息。" >> $GITHUB_STEP_SUMMARY
        exit 1
