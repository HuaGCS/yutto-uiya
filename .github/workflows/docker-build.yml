name: Build and Push to GitHub Container Registry

on:
  push:
    tags:
      - 'v*.*.*'  # 仅在推送 v1.1.4 格式的标签时触发构建
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: '版本号 (例如: 1.1.4 或 latest)'
        required: true
        default: 'latest'
      use_tag_code:
        description: '使用对应标签的代码构建'
        type: boolean
        default: false
      push_to_registry:
        description: '是否推送到镜像仓库'
        type: boolean
        default: true
      architectures:
        description: '构建架构 (可选: amd64, arm64, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
          - 'amd64,arm64'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/yutto-uiya

jobs:
  # 检查标签是否在 dev 分支上
  check-tag-branch:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      tag-branch: ${{ steps.check.outputs.tag-branch }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整的 git 历史
        ref: |
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.use_tag_code == 'true' &&
            github.event.inputs.version != 'latest'
            && format('v{0}', github.event.inputs.version)
            || 'dev'
          }}

    - name: Check if tag is on dev branch
      id: check
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # 手动触发总是允许构建
          echo "should-build=true" >> $GITHUB_OUTPUT
          echo "tag-branch=manual" >> $GITHUB_OUTPUT
          echo "✅ 手动触发构建"
        elif [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "🏷️ 检查标签: $TAG_NAME"

          # 检查标签是否在 dev 分支上
          if git merge-base --is-ancestor ${{ github.sha }} origin/dev; then
            echo "✅ 标签 $TAG_NAME 在 dev 分支上，允许构建"
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "tag-branch=dev" >> $GITHUB_OUTPUT
          else
            echo "❌ 标签 $TAG_NAME 不在 dev 分支上，跳过构建"
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "tag-branch=other" >> $GITHUB_OUTPUT
          fi
        else
          # 其他情况（如分支推送）不构建
          echo "❌ 非标签推送，跳过构建"
          echo "should-build=false" >> $GITHUB_OUTPUT
          echo "tag-branch=none" >> $GITHUB_OUTPUT
        fi

  # 准备构建矩阵
  prepare-matrix:
    needs: check-tag-branch
    runs-on: ubuntu-latest
    # 只有在需要构建时才运行
    if: needs.check-tag-branch.outputs.should-build == 'true'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build-multi: ${{ steps.set-matrix.outputs.build-multi }}
      multi-platforms: ${{ steps.set-matrix.outputs.multi-platforms }}
    steps:
    - name: Set build matrix
      id: set-matrix
      run: |
        # 确定要构建的架构
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ARCH_INPUT="${{ github.event.inputs.architectures }}"
        else
          ARCH_INPUT="all"
        fi

        echo "架构输入: $ARCH_INPUT"

        # 根据输入设置构建矩阵
        case "$ARCH_INPUT" in
          "amd64")
            MATRIX='[{"platform":"linux/amd64","arch":"amd"}]'
            BUILD_MULTI="false"
            MULTI_PLATFORMS="linux/amd64"
            ;;
          "arm64")
            MATRIX='[{"platform":"linux/arm64","arch":"arm64"}]'
            BUILD_MULTI="false"
            MULTI_PLATFORMS="linux/arm64"
            ;;
          "amd64,arm64"|"all"|"")
            MATRIX='[{"platform":"linux/amd64","arch":"amd"},{"platform":"linux/arm64","arch":"arm64"}]'
            BUILD_MULTI="true"
            MULTI_PLATFORMS="linux/amd64,linux/arm64"
            ;;
          *)
            echo "不支持的架构: $ARCH_INPUT，使用默认的所有架构"
            MATRIX='[{"platform":"linux/amd64","arch":"amd"},{"platform":"linux/arm64","arch":"arm64"}]'
            BUILD_MULTI="true"
            MULTI_PLATFORMS="linux/amd64,linux/arm64"
            ;;
        esac

        echo "构建矩阵: $MATRIX"
        echo "构建多架构: $BUILD_MULTI"
        echo "多架构平台: $MULTI_PLATFORMS"

        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
        echo "build-multi=$BUILD_MULTI" >> $GITHUB_OUTPUT
        echo "multi-platforms=$MULTI_PLATFORMS" >> $GITHUB_OUTPUT

  # 构建单架构镜像
  build-single-arch:
    needs: [check-tag-branch, prepare-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 只有在需要构建时才运行
    if: needs.check-tag-branch.outputs.should-build == 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract metadata
      id: meta
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # 手动触发
          VERSION="${{ github.event.inputs.version }}"
          USE_TAG_CODE="${{ github.event.inputs.use_tag_code }}"
          if [[ "$VERSION" != "latest" ]]; then
            SHORT_VERSION="$VERSION"
          else
            SHORT_VERSION="latest"
          fi

          if [[ "$USE_TAG_CODE" == "true" && "$VERSION" != "latest" ]]; then
            echo "🔧 手动触发构建，版本: $VERSION (使用标签 v$VERSION 的代码)"
          else
            echo "🔧 手动触发构建，版本: $VERSION (使用 dev 分支最新代码)"
          fi
        else
          # 标签触发
          VERSION=${GITHUB_REF#refs/tags/}
          SHORT_VERSION=${VERSION#v}
          echo "🏷️ 标签触发构建，版本: $VERSION (使用标签对应代码)"
        fi

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT

        # 转换为小写（GitHub Container Registry 要求）
        IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

        # 生成单架构镜像标签
        ARCH_TAGS="${REGISTRY}/${IMAGE_NAME_LOWER}-${{ matrix.arch }}:${SHORT_VERSION}"

        # 总是添加 latest 标签（因为只有标签推送才会触发）
        ARCH_TAGS="${ARCH_TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}-${{ matrix.arch }}:latest"

        # 如果是稳定版本，添加 stable 标签
        if [[ ! "${VERSION}" =~ (alpha|beta|rc|latest) ]]; then
          ARCH_TAGS="${ARCH_TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}-${{ matrix.arch }}:stable"
        fi

        echo "arch_tags=${ARCH_TAGS}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push single-arch image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true' }}
        tags: ${{ steps.meta.outputs.arch_tags }}
        labels: |
          org.opencontainers.image.title=yutto-uiya-${{ matrix.arch }}
          org.opencontainers.image.description=yutto-uiya - bilibili video downloader with Streamlit WebUI (${{ matrix.arch }})
          org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.platform=${{ matrix.platform }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          TARGETPLATFORM=${{ matrix.platform }}
          TARGETARCH=${{ matrix.arch }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # 构建多架构通用镜像
  build-multi-arch:
    needs: [check-tag-branch, prepare-matrix, build-single-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 只有在需要构建且为多架构时才运行
    if: needs.check-tag-branch.outputs.should-build == 'true' && needs.prepare-matrix.outputs.build-multi == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract metadata
      id: meta
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # 手动触发
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" != "latest" ]]; then
            SHORT_VERSION="$VERSION"
          else
            SHORT_VERSION="latest"
          fi
        else
          # 标签触发
          VERSION=${GITHUB_REF#refs/tags/}
          SHORT_VERSION=${VERSION#v}
        fi

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT

        # 转换为小写
        IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

        # 生成多架构镜像标签
        MULTI_TAGS="${REGISTRY}/${IMAGE_NAME_LOWER}:${SHORT_VERSION}"
        MULTI_TAGS="${MULTI_TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}:latest"

        # 如果是稳定版本，添加 stable 标签
        if [[ ! "${VERSION}" =~ (alpha|beta|rc|latest) ]]; then
          MULTI_TAGS="${MULTI_TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}:stable"
        fi

        echo "multi_tags=${MULTI_TAGS}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push multi-arch image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ needs.prepare-matrix.outputs.multi-platforms }}
        push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true' }}
        tags: ${{ steps.meta.outputs.multi_tags }}
        labels: |
          org.opencontainers.image.title=yutto-uiya
          org.opencontainers.image.description=yutto-uiya - bilibili video downloader with Streamlit WebUI
          org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
        cache-from: |
          type=gha,scope=amd
          type=gha,scope=arm64
        cache-to: type=gha,mode=max,scope=multi

  # 跳过构建的通知
  skip-build:
    needs: check-tag-branch
    runs-on: ubuntu-latest
    if: needs.check-tag-branch.outputs.should-build == 'false'

    steps:
    - name: Skip build notification
      run: |
        echo "## ⏭️ 跳过 Docker 镜像构建" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 跳过原因" >> $GITHUB_STEP_SUMMARY

        TAG_BRANCH="${{ needs.check-tag-branch.outputs.tag-branch }}"
        case "$TAG_BRANCH" in
          "other")
            echo "- ❌ **标签不在 dev 分支上**" >> $GITHUB_STEP_SUMMARY
            echo "- 📝 只有在 dev 分支上的标签才会触发构建" >> $GITHUB_STEP_SUMMARY
            echo "- 💡 请确保在 dev 分支上创建和推送标签" >> $GITHUB_STEP_SUMMARY
            ;;
          "none")
            echo "- ❌ **非标签推送事件**" >> $GITHUB_STEP_SUMMARY
            echo "- 📝 只有推送标签 (v*.*.*) 才会触发构建" >> $GITHUB_STEP_SUMMARY
            echo "- 💡 普通的分支推送不会触发构建" >> $GITHUB_STEP_SUMMARY
            ;;
          *)
            echo "- ❌ **未知原因**" >> $GITHUB_STEP_SUMMARY
            ;;
        esac

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 如何触发构建" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 方式 1: 在 dev 分支创建标签" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "git checkout dev" >> $GITHUB_STEP_SUMMARY
        echo "git tag v1.0.1" >> $GITHUB_STEP_SUMMARY
        echo "git push origin v1.0.1" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 方式 2: 手动触发工作流" >> $GITHUB_STEP_SUMMARY
        echo "- 在 Actions 页面点击 'Run workflow'" >> $GITHUB_STEP_SUMMARY
        echo "- 选择版本号和架构进行构建" >> $GITHUB_STEP_SUMMARY

  # 构建状态通知
  notify:
    needs: [check-tag-branch, prepare-matrix, build-single-arch]
    runs-on: ubuntu-latest
    if: always() && needs.check-tag-branch.outputs.should-build == 'true'

    steps:
    - name: Check multi-arch build status
      id: check-multi
      run: |
        if [[ "${{ needs.prepare-matrix.outputs.build-multi }}" == "true" ]]; then
          echo "multi_arch_needed=true" >> $GITHUB_OUTPUT
          if [[ "${{ needs.build-multi-arch.result }}" == "success" ]] || [[ "${{ needs.build-multi-arch.result }}" == "skipped" ]]; then
            echo "multi_arch_success=true" >> $GITHUB_OUTPUT
          else
            echo "multi_arch_success=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "multi_arch_needed=false" >> $GITHUB_OUTPUT
          echo "multi_arch_success=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata
      id: meta
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
          ARCH_INPUT="${{ github.event.inputs.architectures }}"
          if [[ "$VERSION" != "latest" ]]; then
            SHORT_VERSION="$VERSION"
          else
            SHORT_VERSION="latest"
          fi
        else
          VERSION=${GITHUB_REF#refs/tags/}
          SHORT_VERSION=${VERSION#v}
          ARCH_INPUT="all"
        fi

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT
        echo "arch_input=${ARCH_INPUT}" >> $GITHUB_OUTPUT

        IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

    - name: Success Summary
      if: needs.build-single-arch.result == 'success' && steps.check-multi.outputs.multi_arch_success == 'true'
      run: |
        echo "## ✅ Docker 镜像构建成功！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🏗️ 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **架构**: ${{ steps.meta.outputs.arch_input }}" >> $GITHUB_STEP_SUMMARY
        echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **标签分支**: ${{ needs.check-tag-branch.outputs.tag-branch }}" >> $GITHUB_STEP_SUMMARY
        echo "- **构建时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 📦 构建的镜像" >> $GITHUB_STEP_SUMMARY

        # 根据架构显示不同的镜像
        case "${{ steps.meta.outputs.arch_input }}" in
          "amd64")
            echo "- **AMD64 专用**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-amd:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            ;;
          "arm64")
            echo "- **ARM64 专用**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-arm64:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            ;;
          *)
            echo "- **多架构镜像**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **AMD64 专用**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-amd:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **ARM64 专用**: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-arm64:${{ steps.meta.outputs.short_version }}\`" >> $GITHUB_STEP_SUMMARY
            ;;
        esac

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔄 yutto 自动更新功能" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 镜像集成了 yutto 自动更新功能" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 支持智能空闲检测和安全更新" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 可通过环境变量控制更新策略" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 使用方法" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY

        # 根据构建的架构提供相应的使用示例
        case "${{ steps.meta.outputs.arch_input }}" in
          "amd64")
            echo "# 使用 AMD64 专用镜像" >> $GITHUB_STEP_SUMMARY
            echo "docker run -d -p 8501:8501 -v \$(pwd)/downloads:/app/downloads \\" >> $GITHUB_STEP_SUMMARY
            echo "  ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-amd:${{ steps.meta.outputs.short_version }}" >> $GITHUB_STEP_SUMMARY
            ;;
          "arm64")
            echo "# 使用 ARM64 专用镜像" >> $GITHUB_STEP_SUMMARY
            echo "docker run -d -p 8501:8501 -v \$(pwd)/downloads:/app/downloads \\" >> $GITHUB_STEP_SUMMARY
            echo "  ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}-arm64:${{ steps.meta.outputs.short_version }}" >> $GITHUB_STEP_SUMMARY
            ;;
          *)
            echo "# 使用多架构镜像（推荐，Docker 自动选择合适架构）" >> $GITHUB_STEP_SUMMARY
            echo "docker run -d -p 8501:8501 -v \$(pwd)/downloads:/app/downloads \\" >> $GITHUB_STEP_SUMMARY
            echo "  ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name_lower }}:${{ steps.meta.outputs.short_version }}" >> $GITHUB_STEP_SUMMARY
            ;;
        esac

        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Failure Summary
      if: needs.build-single-arch.result == 'failure' || steps.check-multi.outputs.multi_arch_success == 'false'
      run: |
        echo "## ❌ Docker 镜像构建失败！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **架构**: ${{ steps.meta.outputs.arch_input }}" >> $GITHUB_STEP_SUMMARY
        echo "- **单架构构建**: ${{ needs.build-single-arch.result }}" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ steps.check-multi.outputs.multi_arch_needed }}" == "true" ]]; then
          echo "- **多架构构建**: ${{ needs.build-multi-arch.result }}" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "请查看上方的构建日志获取详细错误信息。" >> $GITHUB_STEP_SUMMARY
        exit 1
